- hosts: localhost
  gather_facts: true
  vars: {items_var: [a, b]}
  tasks:
    - command: /bin/true
      changed_when: true
      notify: h1
    - debug: msg="item={{ item }} os={{ ansible_facts.system }}"
      loop: "{{ items_var }}"
    - copy: {content: "hello\n", dest: /tmp/sansible_proto.txt}
    - template: {src: t.j2, dest: /tmp/sansible_proto_t.txt}
  handlers:
    - name: h1
      debug: msg="HANDLER RAN"
