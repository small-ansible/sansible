[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sansible"
dynamic = ["version"]
description = "ansible-core that also runs natively on Windows: spawn-based workers, pure-Python SSH, no WSL"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Sansible contributors" }]
keywords = ["ansible", "ansible-core", "windows", "automation", "configuration-management", "ssh", "winrm", "psrp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Installation/Setup",
]
dependencies = [
    # Exact pin: the import-time patches are verified against this release.
    # .github/workflows/track-ansible-core.yml moves it forward after the full test matrix passes.
    "ansible-core==2.22.0",
    "paramiko>=3.4",  # ssh connections from Windows controllers (sansible.core.paramiko)
    "pypsrp>=0.8",    # psrp connections to Windows targets
]

[project.optional-dependencies]
test = ["pytest>=8", "pexpect>=4.9"]

[project.scripts]
sansible = "sansible.cli:main"

[project.urls]
Homepage = "https://github.com/small-ansible/sansible"
Repository = "https://github.com/small-ansible/sansible"
Issues = "https://github.com/small-ansible/sansible/issues"
Changelog = "https://github.com/small-ansible/sansible/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/sansible/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sansible", "src/ansible_collections"]

[tool.hatch.build.targets.wheel.force-include]
"src/sansible_autoload.pth" = "sansible_autoload.pth"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "LICENSE", "README.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py313"
extend-exclude = ["experiments", "src/ansible_collections/sansible/core/plugins/connection/paramiko.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF"]
ignore = ["E501", "UP031", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["sansible", "conftest"]

[tool.ruff.lint.per-file-ignores]
"src/ansible_collections/**" = ["E402"]  # ansible plugin convention: DOCUMENTATION precedes imports
