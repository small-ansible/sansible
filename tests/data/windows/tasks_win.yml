# ansible.windows modules; out_dir is a Windows path
- ansible.windows.win_shell: "$PSVersionTable.PSVersion.Major"
  register: ps
- ansible.windows.win_file: {path: "{{ out_dir }}", state: directory}
- ansible.windows.win_copy: {content: "hello from sansible\r\n", dest: "{{ out_dir }}\\copy.txt"}
  notify: copied
- ansible.windows.win_template: {src: ../t.j2, dest: "{{ out_dir }}\\tmpl.txt"}
- ansible.windows.win_stat: {path: "{{ out_dir }}\\copy.txt"}
  register: st
- ansible.builtin.slurp: {src: "{{ out_dir }}\\tmpl.txt"}
  register: tmpl
- ansible.builtin.assert:
    that:
      - ps.stdout | trim | int >= 5
      - st.stat.exists and st.stat.size > 0
      - (tmpl.content | b64decode | trim) == 'x=a,b'
