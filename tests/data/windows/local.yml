# Windows controller, implicit localhost -> sansible.core.winlocal
- hosts: localhost
  gather_facts: true
  vars: {items_var: [a, b]}
  tasks:
    - ansible.builtin.debug: msg="item={{ item }} on {{ ansible_facts.os_family }}"
      loop: "{{ items_var }}"
    - ansible.builtin.set_fact: {n: "{{ items_var | length }}"}
    - ansible.builtin.assert: {that: ["n | int == 2", "ansible_facts.os_family == 'Windows'"]}
    - ansible.builtin.debug: msg="{{ lookup('template', '../t.j2') | trim }}"
    - block:
        - ansible.builtin.fail: {msg: boom}
      rescue:
        - ansible.builtin.set_fact: {rescued: true}
    - ansible.builtin.include_tasks: tasks_win.yml
  handlers:
    - name: copied
      ansible.builtin.debug: msg="HANDLER RAN"
